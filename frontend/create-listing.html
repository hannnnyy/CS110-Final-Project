<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item - NeighborGood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <a href="profile.html" class="header-link">&larr; Cancel and return to Profile</a>
    
    <h1>List a New Item</h1>
    <p style="color: #650; margin-bottom: 30px;">Help your neighbors by lending out items you aren't using.</p>

    <!-- added form structure so this page can connect to the backend later -->
    <form id="listingForm">

        <div class="form-group">
            <label for="title">Item Title</label>
            <input 
                type="text" 
                id="title" 
                name="title" 
                class="form-control" 
                placeholder="e.g., Carpet Cleaner, Power Drill, Tent"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
                <option value="">Select a category</option>
                <option value="Tools & Hardware">Tools & Hardware</option>
                <option value="Kitchen Appliances">Kitchen Appliances</option>
                <option value="Outdoor & Garden">Outdoor & Garden</option>
                <option value="Electronics">Electronics</option>
            </select>
        </div>

        <div class="form-group">
            <label for="condition">Condition</label>
            <select id="condition" name="condition" class="form-control" required>
                <option value="">Select condition</option>
                <option value="Brand New">Brand New</option>
                <option value="Like New">Like New</option>
                <option value="Good">Good (Normal Wear)</option>
                <option value="Fair">Fair (Works fine, looks used)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Item Description</label>
            <textarea 
                id="description" 
                name="description" 
                class="form-control" 
                placeholder="Describe the item, what comes with it, and how it should be used."
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="borrowingConditions">Borrowing Conditions</label>
            <textarea 
                id="borrowingConditions" 
                name="borrowingConditions" 
                class="form-control" 
                placeholder="Example: Please return it clean, return fully charged, or handle with care."
            ></textarea>
        </div>

        <div class="form-group">
            <label for="availabilityStart">Available From</label>
            <input 
                type="date" 
                id="availabilityStart" 
                name="availabilityStart" 
                class="form-control"
                required
            >
        </div>

        <div class="form-group">
            <label for="availabilityEnd">Available Until</label>
            <input 
                type="date" 
                id="availabilityEnd" 
                name="availabilityEnd" 
                class="form-control"
                required
            >
        </div>

        <div class="form-group">
            <label for="neighborhood">Neighborhood</label>
            <input 
                type="text" 
                id="neighborhood" 
                name="neighborhood" 
                class="form-control" 
                placeholder="e.g., Riverside Neighborhood"
                required
            >
        </div>

        <div class="form-group">
            <label for="zipcode">Zipcode</label>
            <input 
                type="text" 
                id="zipcode" 
                name="zipcode" 
                class="form-control" 
                placeholder="e.g., 92507"
                required
            >
        </div>

        <div class="form-group">
            <label for="itemPhoto">Item Photo</label>
            <input 
                type="file" 
                id="itemPhoto" 
                name="itemPhoto" 
                class="form-control"
                accept="image/*"
            >
        </div>

        <button type="submit" class="btn-submit">Publish Listing</button>

    </form>
</div>

<script>
    document.getElementById("listingForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const token = localStorage.getItem("token");
        

        if (!token) {
            alert("You must be logged in to create a listing.");
            window.location.href = "auth.html";
            return;
        }

        
        const payload = {
            title: document.getElementById("title").value,
            category: document.getElementById("category").value,
            condition: document.getElementById("condition").value,
            description: document.getElementById("description").value,
            borrowingConditions: document.getElementById("borrowingConditions").value,
            availabilityStart: document.getElementById("availabilityStart").value,
            availabilityEnd: document.getElementById("availabilityEnd").value,
            neighborhood: document.getElementById("neighborhood").value,
            zipcode: document.getElementById("zipcode").value,
            status: "available"
        };

        try {
            const response = await fetch("http://localhost:5001/api/items", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Listing created successfully!");
                window.location.href = "index.html";
            } else {
                const data = await response.json();
                alert("Failed to create listing: " + (data.message || "Unknown error"));
            }
        } catch (error) {
            console.error("Error creating listing:", error);
            alert("Could not connect to the server.");
        }
    });
</script>

</body>
</html>
