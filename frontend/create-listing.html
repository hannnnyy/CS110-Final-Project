<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List an Item - NeighborGood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <a href="profile.html" class="header-link">&larr; Cancel and return to Profile</a>
    
    <h1>List a New Item</h1>
    <p style="color: #650; margin-bottom: 30px;">Help your neighbors by lending out items you aren't using.</p>

    <div class="form-group">
        <label>Item Title</label>
        <input type="text" class="form-control" placeholder="e.g., Carpet Cleaner, Power Drill, Tent">
    </div>

    <div class="form-group">
        <label>Category</label>
        <select class="form-control">
            <option>Tools & Hardware</option>
            <option>Kitchen Appliances</option>
            <option>Outdoor & Garden</option>
            <option>Electronics</option>
        </select>
    </div>

    <div class="form-group">
        <label>Condition</label>
        <select class="form-control">
            <option>Brand New</option>
            <option>Like New</option>
            <option>Good (Normal Wear)</option>
            <option>Fair (Works fine, looks used)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Description & Borrowing Conditions</label>
        <textarea class="form-control" placeholder="Describe the item and set any rules (e.g., 'Please return it clean', 'Comes with extra batteries')."></textarea>
    </div>

    <div class="photo-upload">
        <div style="font-size: 30px; margin-bottom: 10px;">&#128247;</div>
        Click to upload photos of your item
    </div>

    <button class="btn-submit">Publish Listing</button>

</div>

</body>
</html>
