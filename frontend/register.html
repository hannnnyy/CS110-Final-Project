<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - NeighborGood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- added register page for new user account creation -->
<div class="form-container">
    <a href="index.html" class="header-link">&larr; Back to Home</a>

    <h1>Create Account</h1>
    <p style="color: #650; margin-bottom: 30px;">
        Join your neighborhood lending community.
    </p>

    <div class="form-group">
        <label>Display Name</label>
        <input type="text" class="form-control" placeholder="e.g., Juan V.">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="Enter your email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Create a password">
    </div>

    <div class="form-group">
        <label>Neighborhood</label>
        <input type="text" class="form-control" placeholder="e.g., Riverside Neighborhood">
    </div>

    <div class="form-group">
        <label>Zipcode</label>
        <input type="text" class="form-control" placeholder="e.g., 92507">
    </div>

    <div class="form-group">
        <label>Short Bio</label>
        <textarea class="form-control" placeholder="Tell your neighbors a little about yourself."></textarea>
    </div>

    <button class="btn-submit">Create Account</button>

    <p style="text-align: center; margin-top: 25px;">
        Already have an account?
        <a href="auth.html" style="color: #0056b3; font-weight: bold;">Sign in</a>
    </p>
</div>

</body>
</html>
