<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NeighborGood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- added sign-in page for the frontend authentication flow -->
<div class="form-container">
    <a href="index.html" class="header-link">&larr; Back to Home</a>

    <h1>Welcome Back</h1>
    <p style="color: #650; margin-bottom: 30px;">
        Sign in to borrow and lend items in your neighborhood.
    </p>

    <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="Enter your email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Enter your password">
    </div>

    <button class="btn-submit">Sign In</button>

    <div style="text-align: center; margin: 20px 0; color: #777;">
        or
    </div>

    <button class="btn-outline" style="width: 100%; padding: 15px;">
        Continue with Google
    </button>

    <p style="text-align: center; margin-top: 25px;">
        New to NeighborGood?
        <a href="register.html" style="color: #0056b3; font-weight: bold;">Create an account</a>
    </p>
</div>

</body>
</html>
