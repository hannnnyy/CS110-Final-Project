<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NeighborGood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- added sign-in page for the frontend authentication flow -->
<div class="form-container">
    <a href="index.html" class="header-link">&larr; Back to Home</a>

    <h1>Welcome Back</h1>
    <p style="color: #650; margin-bottom: 30px;">
        Sign in to borrow and lend items in your neighborhood.
    </p>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password">
    </div>

    <button id="loginBtn" class="btn-submit">Sign In</button>

    <div style="text-align: center; margin: 20px 0; color: #777;">
        or
    </div>

    <button class="btn-outline" style="width: 100%; padding: 15px;">
        Continue with Google
    </button>

    <p style="text-align: center; margin-top: 25px;">
        New to NeighborGood?
        <a href="register.html" style="color: #0056b3; font-weight: bold;">Create an account</a>
    </p>
</div>
<!--The script looks for the IDs-->
<script>
    document.getElementById("loginBtn").addEventListener("click", async (e) => {
        e.preventDefault();
        
        
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("http://localhost:5001/api/users/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Save data to localStorage
                localStorage.setItem("user", JSON.stringify(data));
                localStorage.setItem("token", data.token);
                // homepage
                window.location.href = "index.html";
            } else {
                alert("Login failed: " + (data.message || "Invalid credentials"));
            }
        } catch (error) {
            console.error("Error logging in:", error);
            alert("Could not connect to the server.");
        }
    });
</script>

</body>
</html>
